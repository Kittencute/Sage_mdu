    reconnect_delay: 5.0
    delay_warning: 0.03
    messages:
    - FP_A-ODOMETRY
    - FP_A-ODOMENU
    - FP_A-ODOMSH
    - FP_A-ODOMSTATUS
    - FP_A-IMUBIAS
    - FP_A-EOE
    - FP_A-TF
    - FP_A-RAWIMU
    - FP_A-CORRIMU
    - FP_A-LLH
    - NOV_B-INSPVAX
    - FP_A-TEXT
    - FP_A-GNSSANT
    - FP_A-GNSSCORR
