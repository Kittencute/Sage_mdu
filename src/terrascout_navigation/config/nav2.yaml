<robot_namespace>:
  behavior_server:
    ros__parameters:
      cycle_frequency: 5.0
      enable_stamped_cmd_vel: true
      # Recovery spins use a 90-degree target; limit rate/acceleration to avoid abrupt turns.
      max_rotational_vel: 0.8
      min_rotational_vel: 0.2
      rotational_acc_lim: 1.5
  bt_navigator:
    ros__parameters:
      default_nav_to_pose_bt_xml: $(find-pkg-share terrascout_navigation)/config/navigate_to_pose.xml
      error_code_names:
      - compute_path_error_code
      - follow_path_error_code
      navigate_to_pose:
        plugin: nav2_bt_navigator::NavigateToPoseNavigator
      navigators:
      - navigate_to_pose
      transform_tolerance: 0.5
  collision_monitor:
    ros__parameters:
      # Outer zone: reduce speed by 30% (retain 70%).
      PolygonSlow30:
        action_type: slowdown
        enabled: true
        points: '[[1.50, 0.65], [1.50, -0.65], [-0.90, -0.65], [-0.90, 0.65]]'
        polygon_pub_topic: polygon_slow30
        slowdown_ratio: 0.7
        min_points: 10
        type: polygon
        visualize: true

      # Middle zone: reduce speed by 60% (retain 40%).
      PolygonSlow60:
        action_type: slowdown
        enabled: true
        points: '[[0.85, 0.45], [0.85, -0.45], [-0.60, -0.45], [-0.60, 0.45]]'
        polygon_pub_topic: polygon_slow60
        slowdown_ratio: 0.4
        min_points: 10
        type: polygon
        visualize: true

      # Inner zone: stop
      PolygonStop:
        action_type: stop
        enabled: true
        points: '[[0.51, 0.39], [0.51, -0.39], [-0.51, -0.39], [-0.51, 0.39]]'
        polygon_pub_topic: polygon_stop
        min_points: 5
        type: polygon
        visualize: true
      # Match the segmentation cloud's ground-level height reference.
      base_frame_id: base_footprint
      cmd_vel_out_topic: cmd_vel_auto
      enable_stamped_cmd_vel: true
      observation_sources:
      - pointcloud
      pointcloud:
        # Match the segmentation obstacle band relative to base_footprint.
        max_height: 1.05
        min_height: 0.1
        source_timeout: 0.3
        topic: obstacle_points
        type: pointcloud
      polygons:
        - PolygonSlow30
        - PolygonSlow60
        - PolygonStop
      state_topic: collision_monitor_state
      stop_pub_timeout: 2.0
      transform_tolerance: 0.5
  controller_server:
    ros__parameters:
      FollowPath:
        CostCritic:
          consider_footprint: true
        ObstaclesCritic:
          collision_cost: 10000.0
          consider_footprint: true
        PathAlignCritic:
          max_path_occupancy_ratio: 0.05
          use_path_orientations: true
        PathAngleCritic:
          cost_weight: 2.0
          max_angle_to_furthest: 1.0
        PathFollowCritic:
          offset_from_furthest: 5
          threshold_to_consider: 0.5
        PreferForwardCritic:
          cost_weight: 2.0
        # Restore the prior forward acceleration; keep the 1 m/s speed cap.
        ax_max: 2.5
        ax_min: -2.5
        az_max: 3.2
        # Reduce per-cycle optimization work after observed 4.8 Hz controller drops.
        batch_size: 500
        critics:
        - ConstraintCritic
        - CostCritic
        - ObstaclesCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - PreferForwardCritic
        enforce_path_inversion: true
        inversion_xy_tolerance: 0.3
        inversion_yaw_tolerance: 0.5
        iteration_count: 1
        max_angular_accel: 2.5
        model_dt: 0.05
        plugin: nav2_rotation_shim_controller::RotationShimController
        primary_controller: nav2_mppi_controller::MPPIController       
        prune_distance: 10.0
        rotate_to_heading_angular_vel: 0.7
        # Preserve the 1 m/s autonomous forward-speed cap.
        vx_max: 1.0
        # Permit slow reverse maneuvers when forward-only tracking is blocked.
        vx_min: -0.25
        vy_std: 0.0
        vx_std: 0.3
        wz_max: 1.0

      angular_dist_threshold: 1.0
      forward_sampling_distance: 0.8
      rotate_to_heading_angular_vel: 0.7
      controller_frequency: 20.0
      enable_stamped_cmd_vel: true
      failure_tolerance: 0.3
      general_goal_checker:
        plugin: nav2_controller::SimpleGoalChecker
        # Mission completion is based on position; do not require a final heading.
        xy_goal_tolerance: 1.0
        yaw_goal_tolerance: 3.14159
        stateful: true
      intermediate_goal_checker:
        plugin: nav2_controller::SimpleGoalChecker
        xy_goal_tolerance: 2.5
        yaw_goal_tolerance: 3.14159
        stateful: true
      goal_checker_plugins:
      - general_goal_checker
      - intermediate_goal_checker
      min_theta_velocity_threshold: 0.001
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.5
      progress_checker_plugins:
      - progress_checker
      progress_checker:
        plugin: nav2_controller::SimpleProgressChecker
        # Allow slow/cautious motion and brief replanning before declaring a stall.
        movement_time_allowance: 15.0
        required_movement_radius: 0.25
        # Rotation alone can count as progress after a small heading correction.
        required_movement_angle: 0.25
  global_costmap:
    global_costmap:
      ros__parameters:
        # Diagnostic: publish complete grids so visualization consumers do not
        # depend on correctly applying incremental costmap updates.
        always_send_full_costmap: false
        footprint: '[[0.465, 0.35], [0.465, -0.35], [-0.465, -0.35], [-0.465, 0.35]]'
        footprint_padding: 0.01
        global_frame: map
        height: 110
        inflation_layer:
          # Narrow the soft-cost band modestly; keep padding beyond the robot's
          # ~0.58 m circumscribed footprint radius.
          cost_scaling_factor: 3.0
          inflation_radius: 1.0
          plugin: nav2_costmap_2d::InflationLayer
        initial_transform_timeout: 30.0
        robot_base_frame: base_link
        stvl_layer:
          plugin: spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer
          enabled: true
          # Expire stale obstacle voxels after 3 s; live detections refresh them.
          voxel_decay: 3.0
          decay_model: 0
          voxel_size: 0.1
          track_unknown_space: false
          mark_threshold: 0
          update_footprint_enabled: true
          combination_method: 1
          origin_z: 0.0
          publish_voxel_map: false
          transform_tolerance: 0.5
          mapping_mode: false
          observation_sources: obstacle_mark obstacle_clear keepout_mark
          obstacle_mark:
            data_type: PointCloud2
            topic: /<robot_namespace>/obstacle_points
            marking: true
            clearing: false
            obstacle_range: 20.0
            # This source receives obstacle_points already height-filtered in
            # base_footprint. These bounds are global-frame Z, not robot-relative.
            min_obstacle_height: -1000.0
            max_obstacle_height: 1000.0
            expected_update_rate: 0.0
            observation_persistence: 0.0
            filter: voxel
            # Match local filtering to suppress low-density stray returns.
            voxel_min_points: 3
            clear_after_reading: true
          obstacle_clear:
            enabled: true
            data_type: PointCloud2
            topic: /<robot_namespace>/raw_points
            marking: false
            clearing: true
            min_z: -1.0
            max_z: 3.0
            horizontal_fov_angle: 6.28
            vertical_fov_angle: 1.03
            vertical_fov_padding: 0.05
            decay_acceleration: 1.0
            model_type: 1
          keepout_mark:
            enabled: true
            data_type: PointCloud2
            topic: /<robot_namespace>/keepout_obstacle_points
            marking: true
            clearing: false
            obstacle_range: 1000.0
            # Ground segmentation is the robot-relative height gate; do not
            # apply a 1.5 m cutoff here after transforming to odom.
            min_obstacle_height: -1000.0
            max_obstacle_height: 1000.0
            expected_update_rate: 0.0
            observation_persistence: 0.0
            filter: voxel
            voxel_min_points: 1
            clear_after_reading: true
        plugins:
        - stvl_layer
        - inflation_layer
        # Global planning map; keep below local update rate to limit CPU load.
        update_frequency: 3.0
        publish_frequency: 2.0
        resolution: 0.1
        rolling_window: true
        width: 110
  local_costmap:
    local_costmap:
      ros__parameters:
        always_send_full_costmap: false
        footprint: '[[0.465, 0.35], [0.465, -0.35], [-0.465, -0.35], [-0.465, 0.35]]'
        footprint_padding: 0.01
        global_frame: odom
        robot_base_frame: base_link
        height: 15
        inflation_layer:
          # Faster cost falloff with distance; physical safety radius unchanged.
          cost_scaling_factor: 4.0
          inflation_radius: 0.9
          plugin: nav2_costmap_2d::InflationLayer
        initial_transform_timeout: 30.0
        stvl_layer:
          plugin: spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer
          enabled: true
          # Expire stale local obstacle voxels after 3 s; live detections refresh them.
          voxel_decay: 3.0
          decay_model: 0
          voxel_size: 0.1
          track_unknown_space: false
          mark_threshold: 0
          update_footprint_enabled: true
          combination_method: 1
          origin_z: 0.0
          publish_voxel_map: false
          transform_tolerance: 0.5
          mapping_mode: false
          observation_sources: obstacle_mark obstacle_clear keepout_mark
          obstacle_mark:
            data_type: PointCloud2
            topic: /<robot_namespace>/obstacle_points
            marking: true
            clearing: false
            obstacle_range: 20.0
            # Segmentation already filters obstacle height in the robot frame;
            # keep this broad because the cloud is transformed into odom here.
            min_obstacle_height: -1000.0
            max_obstacle_height: 1000.0
            expected_update_rate: 0.0
            observation_persistence: 0.0
            filter: voxel
            # Match global filtering while rejecting only isolated returns.
            voxel_min_points: 4
            clear_after_reading: true
          obstacle_clear:
            enabled: true
            data_type: PointCloud2
            topic: /<robot_namespace>/raw_points
            marking: false
            clearing: true
            min_z: -1.0
            max_z: 3.0
            horizontal_fov_angle: 6.28
            vertical_fov_angle: 1.03
            vertical_fov_padding: 0.05
            decay_acceleration: 1.0
            model_type: 1
          keepout_mark:
            enabled: true
            data_type: PointCloud2
            topic: /<robot_namespace>/keepout_obstacle_points
            marking: true
            clearing: false
            obstacle_range: 200.0
            min_obstacle_height: -1000.0
            max_obstacle_height: 1000.0
            expected_update_rate: 0.0
            observation_persistence: 0.0
            filter: voxel
            voxel_min_points: 1
            clear_after_reading: true
        plugins:
        - stvl_layer
        - inflation_layer
        # Refresh the rolling obstacle map near the 10 Hz simulated LiDAR rate.
        update_frequency: 10.0
        publish_frequency: 2.0
        resolution: 0.05
        rolling_window: true
        width: 15
  planner_server:
    ros__parameters:
      GridBased:
        cost_penalty: 3.0
        lattice_filepath: $(find-pkg-share terrascout_navigation)/config/diff_lattice.json
        non_straight_penalty: 1.2
        plugin: nav2_smac_planner::SmacPlannerLattice
        rotation_penalty: 1.5
        tolerance: 0.5
        allow_unknown: true
      expected_planner_frequency: 1.0
  velocity_smoother:
    ros__parameters:
      enable_stamped_cmd_vel: true
      max_accel:
      - 2.5
      - 0.0
      - 3.2
      max_decel:
      - -2.5
      - 0.0
      - -3.2
      max_velocity:
      - 1.0
      - 0.0
      - 1.68
      min_velocity:
      # Match MPPI's bounded reverse velocity so the smoother does not clip it.
      - -0.25
      - 0.0
      - -1.68
  lifecycle_manager_navigation:
    ros__parameters:
      autostart: true
      bond_timeout: 0.0
      node_names:
      - controller_server
      - planner_server
      - behavior_server
      - velocity_smoother
      - collision_monitor
      - bt_navigator